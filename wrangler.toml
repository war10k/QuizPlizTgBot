name = "donat-to-tea-bot"        # Точное имя вашего воркера из панели Cloudflare
main = "worker.js"              # Имя файла с кодом бота
compatibility_date = "2026-06-09" # Текущая дата для фиксации версии API Cloudflare [ June 9, 2026]
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
